  <path d="M18 50 Q50 14 82 50" fill="none" stroke="#f2b544" stroke-width="2" opacity=".5"/>
  <path d="M18 50 Q50 86 82 50" fill="none" stroke="#f2b544" stroke-width="2" opacity=".5"/>
  <path d="M18 50 Q34 30 50 50 T82 50" fill="none" stroke="#ffd27a" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="18" cy="50" r="5" fill="#e8e2d4"/>
  <circle cx="82" cy="50" r="5" fill="#c8722c"/>
  <rect x="18" y="74" width="64" height="10" rx="2" fill="#e8e2d4"/>
  <rect x="27" y="74" width="5" height="6" fill="#1d2433"/>
  <rect x="39" y="74" width="5" height="6" fill="#1d2433"/>
  <rect x="56" y="74" width="5" height="6" fill="#1d2433"/>
  <rect x="66" y="74" width="5" height="6" fill="#1d2433"/>
</svg>
