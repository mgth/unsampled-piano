<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <title>Unsampled Piano</title>
  <!-- A string held at the agraffe (left) and the bridge (right), its
       fundamental's envelope and its second mode, above a keyboard. -->
