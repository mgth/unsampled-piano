[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/mgth/unsampled-piano"

[workspace.dependencies]
piano-core = { path = "crates/piano-core" }
piano-analysis = { path = "crates/piano-analysis" }
piano-eval = { path = "crates/piano-eval" }
piano-host = { path = "crates/piano-host" }
piano-params = { path = "crates/piano-params" }
piano-control = { path = "crates/piano-control" }
piano-ui = { path = "crates/piano-ui" }
hound = "3.5"
midly = "0.5"
realfft = "3.5"
clap = { version = "4.6", features = ["derive"] }
claxon = "0.4"
nalgebra = "0.35"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
cpal = "0.18"
midir = "0.11"
rtrb = "0.4"
criterion = "0.8"
assert_no_alloc = "1.1"
egui = "0.37.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }

[profile.release]
codegen-units = 1
lto = "thin"
debug = 1

[profile.bench]
inherits = "release"

# Distributed builds (`cargo build --profile dist`): no debug info.
[profile.dist]
inherits = "release"
debug = false
strip = true

# Analysis/tests on long signals are painfully slow unoptimised.
[profile.dev.package."*"]
opt-level = 2
[profile.test]
opt-level = 2
