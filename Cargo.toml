[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
piano-core = { path = "crates/piano-core" }
piano-analysis = { path = "crates/piano-analysis" }
piano-eval = { path = "crates/piano-eval" }
piano-host = { path = "crates/piano-host" }
hound = "3.5"
midly = "0.5"
realfft = "3.5"
clap = { version = "4.6", features = ["derive"] }
claxon = "0.4"
nalgebra = "0.35"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
cpal = "0.18"
midir = "0.11"
rtrb = "0.4"
criterion = "0.8"
assert_no_alloc = "1.1"

[profile.release]
codegen-units = 1
lto = "thin"
debug = 1

[profile.bench]
inherits = "release"

# Analysis/tests on long signals are painfully slow unoptimised.
[profile.dev.package."*"]
opt-level = 2
[profile.test]
opt-level = 2
