# Close miking: lid open at 35°, two microphones 40 cm above the board, over
# the bass and the treble parts of the bridge (closest to the references'
# spectral balance, docs/presence.md), in the default hall.
# Level: close microphones hear the piano ≈ 13 dB louder.
output_gain_db = -9.6

[soundboard]
lid_angle = 35.0
mics = [[0.5, 0.45, 0.4], [1.2, 0.85, 0.4]]
