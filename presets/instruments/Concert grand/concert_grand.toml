# A 274 cm concert grand, dimensioned after the IRCAM Steinway D
# (Chabassier & Duruflé, INRIA RT-425, and the maker's figures;
# docs/steinway_d.md), then matched to a recorded commercial modelled D.
# Everything else is the default instrument's.

# RT-425's hammer masses against Stulov's: 1.02 at C1, 1.05 at C4, 1.07 at C7.
hammer_mass_scale = 1.053
hammer_mass_slope = 0.00078
# RT-425's strike point is 0.116–0.122 up to B7: no move towards the agraffe.
strike_ratio_top = 0.0
# Top felt over a hard core: the recorded D's middle attack is darker than the
# default's, and its low bass brightens far more from mf to ff (2–4 kHz at A0–B1,
# 36 dB from velocity 60 to 100; 22 here with the harder felt below, 31 before it).
core_depth_bass = 0.3
core_depth_mid = 0.5
core_hardness = 8.0
# Fields a partial preset would otherwise read as saved before them
# (uniform shank, straight bass bridge, upright main strings): the default's.
shank_freq_mid = 700.0
# A felt four times harder than the default's, softened again at the top (0.15 by
# default): against a real concert grand at the player's seat the bass and the middle
# had too much of their low partials and too little of the high ones, the attack
# heard as soft from A1 to B2; the eight real grands of the bench agree (bass 1.50
# to 1.09, middle 1.70 to 1.17). The recorded commercial D asks for the softer felt
# (docs/bass_gaps.md).
hardness = 1.2
hardness_slope_top = 0.035

[polarization]
# The sideways coupling as measured on a real grand's partials (0.03, the cross
# term at its passive limit, no slope): a real concert grand's single strings
# decay at one rate, early and late (docs/real_board.md). Every field written.
enabled = true
h_coupling = 0.03
cross = 0.1732
detune_cents = 0.3
radiation = 0.1
hammer_tilt = 0.05
smooth = 0.0
slope = 0.0
slope_from = 0.0

[inharmonicity]
# RT-425's strings, fitted to the law (log B rms 0.064).
a_bass = -0.1163
b_bass = -6.727
a_treble = 0.0903
b_treble = -13.526

[stretch]
# The recorded D's tuning: A0 −12, C2 −5, C6 +3, C8 +44 cents.
a_t = 0.917211
k_t = 0.1
a_b = 0.265277
k_b = 0.077178
c = -1.402352

[losses]
# The default's frequency-dependent string loss up to C5: above 1.2 kHz a real concert
# grand's strings lose two to three times less than with 2.0e-7. That value, set for
# the recorded D's treble, stays from C6 up, where the real grand keeps it too, coming
# in over the octave below (docs/bass_gaps.md).
b2 = 6.0e-8
b2_top = 2.0e-7
b2_top_from = 84
# Wound strings on the bass bridge only, A0–E2.
wound_until = 41

[scale]
# Plain strings F2–B7: 1.91 per octave, C8 at 4.94 cm. Wound strings: RT-425's
# lengths, 2.01 m at C1 down to 1.38 m at E2.
wound_lengths_by_key = true
# Tension: RT-425's, string by string, from 1.8 kN on the wound strings.
tension_by_key = true
len_c8 = 0.0494
ratio_per_octave = 1.91
break_note = 41
len_a0 = 2.01
tension = 750.0

[unison]
# 8 single strings (A0–E1), 5 bichords (F1–A1), then trichords.
bichord_from = 29
trichord_from = 34

[soundboard]
# Each key drives the built board's modes at its own bridge point, up to their last.
exact_below = 6000.0
# Chabassier's thesis, fve = 2e-5·f² + 0.07·f, read as its decay constant: 2 % at low
# frequencies, as it says and as measured (docs/real_board.md).
loss_factor = 0.0223
loss_corner = 3500.0
# The D's board, RT-425's figure 1: 2.1 m², along the spine from its front edge,
# which runs 12.4 cm further forward on the treble side than at the spine, so a
# is 2.124 m. The outline's ten points follow that slanted edge and the bentside.
a = 2.124
b = 1.46
outline = [[0.0, 0.0096], [0.1149, 0.0068], [0.2373, 0.1781], [0.3362, 0.3014], [0.5621, 0.363], [0.8682, 0.411], [0.9976, 0.5753], [0.9976, 0.9315], [0.9341, 1.0], [0.0584, 1.0]]
# RT-425's bridges: 20 keys on the bass bridge, the main bridge from F2, point by
# point. These are the strings' real, slanted ends: no slant is added below.
main_bridge_from = 41
treble_bridge = [[0.0443, 0.048], [0.0809, 0.202], [0.1596, 0.38], [0.3441, 0.579], [0.8023, 0.842]]
bass_bridge = [[0.5765, 0.562], [0.8707, 0.753]]
# Only the modes above the built board's, 6 kHz: their level comes from the structure.
rho_h = 14.7
# The flat board's first modes are 33, 52, 78, 89 Hz, 31, 49, 74, 85 Hz under the air;
# a real 2.74 m board's, unstrung, 49, 67, 89, 112 Hz (Conklin 1996). 40 Hz of crown
# gives 49, 62, 83, 94 Hz.
crown_freq = 40.0
# What the board radiates comes back off the rim, the frame and the lid.
case_field = true
# The low modes' extra loss at the measured boards' level, 4.7 % at 83 Hz
# (docs/real_board.md); the rim, made two-way, takes almost nothing, so no edge loss.
loss_low_corner = 80.0
edge_loss = 0.0
# No piston mode: a fit, which took 3-7 dB/s from the fundamentals of A0-E1 where
# a real concert grand's lose 0.7 (docs/real_board.md).
piston_freq = 0.0
bass_bridge_bow = 0.034
main_string_slant = 0.0

# The board as it is built, by finite elements: plate, ribs and bridges of the D
# (fem::BoardStructure::STEINWAY_D, docs/real_board.md).
[soundboard.structure]
enabled = true
# Its own modes up to 6 kHz, 1104 of them: there its shortest waves, across the grain,
# are 4.3 cm long on elements of 1 cm; 8 kHz was heard to sound the same
# (docs/real_board.md, "Above 3 kHz").
below = 6000.0
# The strings hold the bridge, T·(1/L + 1/l) each: the first modes at 68, 77, 95
# and 111 Hz, a real strung concert grand's first resonance being at 66-72 Hz.
strings = true

[frame]
# The plate over the board and the pin block (offset_x −0.2), as the default's.
a = 2.324
b = 1.46

[rim]
follows_outline = true
thickness = 0.083

[damper]
# The commercial D's last damper, G6, checked on its key-ups: the only damper value
# not the default's; a partial section would lose the others.
position = 0.14
behind_strike = 0.06
width = 0.02
node_floor = 0.15
strength = 0.2
# The felts weaken up the keyboard, so that every key stops at about the same rate, as the
# commercial D's do (docs/release.md).
strength_slope = 1.0
contact_exponent = 1.5
# The felt's grip on the sideways motion: at 0.03 the slow mode the bridge's cross term
# leaves rang on after the key-up, 34-50 dB under the attack from key to key (docs/release.md).
horizontal = 0.3
highest_note = 91
pedal_free = 0.3
pedal_contact = 0.6
pedal_curve = 1.2
fall_time = 0.015
lift_time = 0.005
