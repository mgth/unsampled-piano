# A 274 cm concert grand, dimensioned after the IRCAM Steinway D
# (Chabassier & Duruflé, INRIA RT-425, and the maker's figures;
# docs/steinway_d.md), then matched to a recorded commercial modelled D.
# Everything else is the default instrument's.

# RT-425's hammer masses against Stulov's: 1.02 at C1, 1.05 at C4, 1.07 at C7.
hammer_mass_scale = 1.053
hammer_mass_slope = 0.00078
# RT-425's strike point is 0.116–0.122 up to B7: no move towards the agraffe.
strike_ratio_top = 0.0
# Top felt over a hard core: the recorded D's middle attack is darker than the
# default's, and its low bass brightens far more from mf to ff (2–4 kHz at A0–B1,
# 36 dB from velocity 60 to 100; 31 here, 23 without this felt in the bass).
core_depth_bass = 0.3
core_depth_mid = 0.5
core_hardness = 8.0
# Fields a partial preset would otherwise read as saved before them
# (uniform shank, straight bass bridge, upright main strings): the default's.
shank_freq_mid = 700.0

[inharmonicity]
# RT-425's strings, fitted to the law (log B rms 0.064).
a_bass = -0.1163
b_bass = -6.727
a_treble = 0.0903
b_treble = -13.526

[stretch]
# The recorded D's tuning: A0 −12, C2 −5, C6 +3, C8 +44 cents.
a_t = 0.917211
k_t = 0.1
a_b = 0.265277
k_b = 0.077178
c = -1.402352

[losses]
# 3.3 × the default's frequency-dependent string loss: A0–B1's high partials
# then decay within 1.4 dB/s of the D's (3.3 at 3.0e-7, better for the top).
b2 = 2.0e-7
# Wound strings on the bass bridge only, A0–E2.
wound_until = 41

[scale]
# Plain strings F2–B7: 1.91 per octave, C8 at 4.94 cm. Wound strings: RT-425's
# lengths, 2.01 m at C1 down to 1.38 m at E2.
wound_lengths_by_key = true
# Tension: RT-425's, string by string, from 1.8 kN on the wound strings.
tension_by_key = true
len_c8 = 0.0494
ratio_per_octave = 1.91
break_note = 41
len_a0 = 2.01
tension = 750.0

[unison]
# 8 single strings (A0–E1), 5 bichords (F1–A1), then trichords.
bichord_from = 29
trichord_from = 34

[soundboard]
# Each key drives the built board's modes at its own bridge point.
exact_below = 3000.0
# Chabassier's thesis, fve = 2e-5·f² + 0.07·f, read as its decay constant: 2 % at low
# frequencies, as it says and as measured (docs/real_board.md).
loss_factor = 0.0223
loss_corner = 3500.0
# The D's board, RT-425's figure 1: 2.1 m², along the spine from its front edge,
# which runs 12.4 cm further forward on the treble side than at the spine, so a
# is 2.124 m. The outline's ten points follow that slanted edge and the bentside.
a = 2.124
b = 1.46
outline = [[0.0, 0.0096], [0.1149, 0.0068], [0.2373, 0.1781], [0.3362, 0.3014], [0.5621, 0.363], [0.8682, 0.411], [0.9976, 0.5753], [0.9976, 0.9315], [0.9341, 1.0], [0.0584, 1.0]]
# RT-425's bridges: 20 keys on the bass bridge, the main bridge from F2, point by
# point. These are the strings' real, slanted ends: no slant is added below.
main_bridge_from = 41
treble_bridge = [[0.0443, 0.048], [0.0809, 0.202], [0.1596, 0.38], [0.3441, 0.579], [0.8023, 0.842]]
bass_bridge = [[0.5765, 0.562], [0.8707, 0.753]]
# Only the modes above the built board's, 3 kHz: their level comes from the structure.
rho_h = 14.7
# The flat board's first modes are 33, 52, 78, 89 Hz; a real 2.74 m board's, unstrung,
# 49, 67, 89, 112 Hz (Conklin 1996). 36 Hz of crown gives 49, 63, 86, 96 Hz.
crown_freq = 36.0
bass_bridge_bow = 0.034
main_string_slant = 0.0

# The board as it is built, by finite elements: plate, ribs and bridges of the D
# (fem::BoardStructure::STEINWAY_D, docs/real_board.md).
[soundboard.structure]
enabled = true

[frame]
# The plate over the board and the pin block (offset_x −0.2), as the default's.
a = 2.324
b = 1.46

[rim]
follows_outline = true
thickness = 0.083

[damper]
# The commercial D's last damper, G6, checked on its key-ups: the only damper value
# not the default's; a partial section would lose the others.
position = 0.14
behind_strike = 0.06
width = 0.02
node_floor = 0.15
strength = 0.2
contact_exponent = 1.5
horizontal = 0.03
highest_note = 91
pedal_free = 0.3
pedal_contact = 0.6
pedal_curve = 1.2
fall_time = 0.015
lift_time = 0.005
