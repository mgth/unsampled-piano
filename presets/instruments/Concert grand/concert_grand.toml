# A 274 cm concert grand, dimensioned after the IRCAM Steinway D
# (Chabassier & Duruflé, INRIA RT-425, and the maker's figures;
# docs/steinway_d.md), then matched to a recorded commercial modelled D.
# Everything else is the default instrument's.

# RT-425's hammer masses against Stulov's: 1.01 at A0, 1.05 at C4, 1.07 at C8.
hammer_mass_scale = 1.05
# Top felt over the core in the middle: the recorded D's middle attack is
# darker than the default's.
core_depth_mid = 0.5
# Fields a partial preset would otherwise read as saved before them
# (uniform shank, straight bass bridge, upright main strings): the default's.
shank_freq_mid = 700.0

[inharmonicity]
# Fitted on the recorded commercial D (tools/fit_preset.py, log B rms 0.15);
# within 5–10 % of RT-425's strings from C2 to C8.
a_bass = -0.160799
b_bass = -5.841641
a_treble = 0.084324
b_treble = -13.062355

[stretch]
# The recorded D's tuning: A0 −12, C2 −5, C6 +3, C8 +44 cents.
a_t = 0.917211
k_t = 0.1
a_b = 0.265277
k_b = 0.077178
c = -1.402352

[losses]
# 3.3 × the default's frequency-dependent string loss: A0–B1's high partials
# then decay within 1.4 dB/s of the D's (3.3 at 3.0e-7, better for the top).
b2 = 2.0e-7
# Wound strings on the bass bridge only, A0–E2.
wound_until = 41

[scale]
# Plain strings F2–B7: 1.91 per octave, C8 at 4.94 cm. Longest string
# 2.01 m. The wound strings' fall to 1.38 m at E2 is not in the law.
# Tension: RT-425's, string by string, from 1.8 kN on the wound strings.
tension_by_key = true
len_c8 = 0.0494
ratio_per_octave = 1.91
break_note = 41
len_a0 = 2.01
tension = 750.0

[unison]
# 8 single strings (A0–E1), 5 bichords (F1–A1), then trichords.
bichord_from = 29
trichord_from = 34

[soundboard]
# Board 1.99 m along the spine, 1.46 m across. The D's 20 keys on the bass bridge
# and its main bridge's lowest point, F2, from RT-425: the rest of that bridge
# stays the default's, the real one leaving this board's outline at the top
# (C8 12 dB short; the D's front edge is slanted, this outline's is not).
a = 1.99
b = 1.46
main_bridge_from = 41
treble_bridge = [[0.035, 0.077], [0.051, 0.245], [0.136, 0.413], [0.327, 0.581], [0.794, 0.842]]
# The default's bass side moves too freely for strings at their real tension:
# against the recorded D, A0–B1's 1–2 kHz 4–7 dB over at the default's slope, within
# 1 dB at −0.04, and the partials up to the 24th decay close to the D's.
impedance_slope_bass = -0.04
# That stiffer side leaves A0–D2 short at 50–100 Hz; lower modes bring it back
# to −4 dB at the attack, level in the body.
crown_freq = 70.0
bass_bridge_bow = 0.034
main_string_slant = 8.0

[frame]
# The plate over the board and the pin block (offset_x −0.2), as the default's.
a = 2.19
b = 1.46

[rim]
thickness = 0.083
