# Concert set-up: lid open at 35°, a pair of microphones in front of the
# opening (1.6 m on the calibrated board), 2 m above the board (at 1 m they
# sat under the lid's reflection and lost 10 dB at 2–4 kHz in the middle,
# docs/presence.md). Positions relative to the board.
# Omnidirectional pair (spaced A–B, the usual classical set-up).
# Level: same loudness as the earlier 1 m set-up.
[soundboard]
lid_angle = 35.0
mics_relative = true
mics = [[0.323529, -1.230769, 2.0], [0.735294, -1.230769, 2.0]]
# On an upright: 2 m in front of it, 0.2·a above the board's top (1.5 m high
# on a 1.05 m board), 0.6 m apart, the left one on the bass side: the same
# room level and direct level as a grand's set-up (docs/upright.md).
mics_upright = [[-0.2, 0.7, 2.0], [-0.2, 0.3, 2.0]]
mic_gain_db = 3.4
mic_pattern = 1.0
