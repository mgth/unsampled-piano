[package]
name = "piano-render"
description = "Deterministic offline renderer: MIDI file (or single note) to WAV."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "unsampled-piano-render"
path = "src/main.rs"

[dependencies]
piano-core.workspace = true
piano-host.workspace = true
piano-control.workspace = true
hound.workspace = true
clap.workspace = true

[features]
experimental-rayleigh = ["piano-core/experimental-rayleigh", "piano-host/experimental-rayleigh", "piano-control/experimental-rayleigh"]
