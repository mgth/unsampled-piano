[package]
name = "piano-ui"
description = "egui interface of the instrument: every parameter, presets, rebuild status. Only egui: the standalone player and the plugin provide the window."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
piano-core = { workspace = true, features = ["serde"] }
piano-host.workspace = true
piano-params.workspace = true
# Text needs fonts: since 0.37 egui ships them only on request (eframe
# asks for them, the plugin adapter does not).
egui = { workspace = true, features = ["default_fonts"] }

[dev-dependencies]
eframe.workspace = true
midir.workspace = true
