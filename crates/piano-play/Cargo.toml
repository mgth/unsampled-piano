[package]
name = "piano-play"
description = "Real-time standalone player: a PipeWire graph node (audio, MIDI in, MIDI mirror out) or cpal output."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "unsampled-piano"
path = "src/main.rs"

[dependencies]
piano-core.workspace = true
piano-host.workspace = true
piano-control.workspace = true
piano-params.workspace = true
piano-ui.workspace = true
eframe.workspace = true
egui.workspace = true
cpal = { workspace = true, features = ["pipewire", "jack", "realtime"] }
midir.workspace = true
rtrb.workspace = true
clap.workspace = true
jack = "0.13"
toml.workspace = true
