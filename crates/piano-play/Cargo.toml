[package]
name = "piano-play"
description = "Real-time standalone player: a PipeWire graph node (audio, MIDI in, MIDI mirror out) or cpal output (WASAPI, ASIO, ALSA…)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "unsampled-piano"
path = "src/main.rs"

[dependencies]
piano-core.workspace = true
piano-host.workspace = true
piano-control.workspace = true
piano-params.workspace = true
# The Model page's 3D view on the GPU (eframe paints with glow).
piano-ui = { workspace = true, features = ["gpu"] }
piano-mcp.workspace = true
eframe.workspace = true
egui.workspace = true
cpal = { workspace = true, features = ["pipewire", "jack", "realtime"] }
midir.workspace = true
rtrb.workspace = true
clap.workspace = true
jack = "0.13"
libc = "0.2"
toml.workspace = true

# The executable's icon (build.rs), for Windows targets: rc.exe on Windows,
# MinGW's windres when cross-compiling.
[build-dependencies]
winresource = "0.1.31"

# Real-time priority for the engine's voice workers (Linux: libc directly;
# this crate needs rtkit over D-Bus there).
[target.'cfg(not(target_os = "linux"))'.dependencies]
audio_thread_priority = { version = "0.35", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[features]
experimental-rayleigh = ["piano-core/experimental-rayleigh", "piano-host/experimental-rayleigh", "piano-control/experimental-rayleigh"]
# ASIO output on Windows (`--host asio`). Building it needs the Steinberg
# ASIO SDK (`CPAL_ASIO_DIR`, else downloaded), libclang and MSVC.
asio = ["cpal/asio"]
