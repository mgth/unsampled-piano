<div id="piano-keyboard-h1">
  <h2>Tenue de la fondamentale · 88 touches</h2>
  <div class="viz-controls">
    <label class="form-label">Touche<select class="form-select" id="h1-note"></select></label>
    <label class="form-label">Vélocité<select class="form-select" id="h1-velocity"><option value="45">45 · doux</option><option value="56">56 · moyen</option><option value="100">100 · fort</option></select></label>
  </div>
  <div id="h1-legend" class="viz-row"></div>
  <div id="h1-detail"></div>
  <div id="h1-status" class="text-small" aria-live="polite"></div>
  <h3>Clavier · écart à la moyenne à 1,1 s</h3>
  <div id="h1-overview"></div>
  <div class="tooltip" role="tooltip" id="h1-tooltip" hidden></div>
</div>
<style>
#piano-keyboard-h1 {position:relative}
#piano-keyboard-h1 .h1-plot {display:block; width:100%; overflow:visible}
#piano-keyboard-h1 .h1-plot text {fill:var(--foreground);font-size:12px}
#piano-keyboard-h1 .h1-plot .domain, #piano-keyboard-h1 .h1-plot .tick line {stroke:var(--border)}
#piano-keyboard-h1 #h1-legend {gap:12px; margin:12px 0}
#piano-keyboard-h1 #h1-legend button {background:transparent;border:0;color:var(--foreground);padding:0;display:inline-flex;align-items:center;gap:6px;font:inherit}
#piano-keyboard-h1 #h1-legend button[aria-pressed="false"] {opacity:.5}
#piano-keyboard-h1 .h1-swatch {display:inline-block;width:20px;height:3px;background:var(--swatch)}
#piano-keyboard-h1 #h1-tooltip {position:absolute;pointer-events:none;z-index:2;background:var(--popover);color:var(--popover-foreground);padding:8px;max-width:260px}
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
const root=document.getElementById('piano-keyboard-h1');
const payload=__KEYBOARD_DATA__;
const times=[.03,.13,.3,.5,.7,.9,1.1], notes=Object.keys(payload.notes).map(Number);
const specs=[{key:'current',label:'App actuelle',color:'var(--viz-series-1)'},{key:'candidate',label:'Candidat clavier',color:'var(--viz-series-2)'},{key:'main',label:'Main',color:'var(--viz-series-3)',dash:'5 4'},{key:'mean',label:'Moyenne de comparaison',color:'var(--foreground)',dash:'2 4'},{key:'range',label:'Min–max mesuré',color:'var(--muted-foreground)'},{key:'estimated',label:'Voisins estimés ± marge',color:'var(--viz-series-4)',dash:'4 3'},{key:'trial',label:'Essai non retenu',color:'var(--viz-series-5)',dash:'2 3'}];
const labels={fast:'trop rapide',slow:'trop lente',mixed:'écarts opposés',within:'dans l’étendue ±3 dB',insufficient:'mesure insuffisante'};
const visible=Object.fromEntries(specs.map(s=>[s.key,true]));
let state={note:107,velocity:56}, first=true, pinned=false;
const noteSelect=root.querySelector('#h1-note'),velocitySelect=root.querySelector('#h1-velocity'),tooltip=root.querySelector('#h1-tooltip');
notes.forEach(n=>{const opt=document.createElement('option');opt.value=n;opt.textContent=payload.notes[n];noteSelect.appendChild(opt)});
function restore(saved){const p=saved?.modelContent||saved;if(p&&notes.includes(+p.note))state.note=+p.note;if(p&&[45,56,100].includes(+p.velocity))state.velocity=+p.velocity;if(p?.visible)for(const key in visible)if(typeof p.visible[key]==='boolean')visible[key]=p.visible[key];}
restore(window.openai?.widgetState);
function persist(){window.openai?.setWidgetState({modelContent:{version:4,note:state.note,noteLabel:payload.notes[state.note],velocity:state.velocity,visible,analysis:'H1 88 touches, main/app/candidat'},privateContent:null})?.catch(()=>{});}
const legend=root.querySelector('#h1-legend');
specs.forEach(s=>{const button=document.createElement('button');button.type='button';button.className='cursor-interaction';button.dataset.series=s.key;button.innerHTML=`<span class="h1-swatch" style="--swatch:${s.color}" aria-hidden="true"></span>${s.label}`;button.onclick=()=>{visible[s.key]=!visible[s.key];draw();persist()};legend.appendChild(button)});
function meanRef(row,index){const ys=Object.values(row.refs).map(a=>a.at(index)).filter(Number.isFinite),comparison=row.comparisonMean?.at(index);const mean=Number.isFinite(comparison)?comparison:ys.length?d3.mean(ys):null;return Number.isFinite(mean)?{mean,lo:ys.length?d3.min(ys):null,hi:ys.length?d3.max(ys):null,count:ys.length}:null;}
function seriesValue(row,key,index){return key==='mean'?meanRef(row,index)?.mean:key==='estimated'?row.estMean?.at(index):row[key]?.at(index);}
function seriesForDetail(row){const ts=row.times||times;const refs=ts.map((x,i)=>({x,...(meanRef(row,i)||{mean:null,lo:null,hi:null})}));return {band:refs,estimatedBand:ts.map((x,i)=>({x,lo:row.estLo?.[i],hi:row.estHi?.[i]})),series:specs.filter(s=>s.key!=='range').map(s=>({...s,values:ts.map((x,i)=>({x,y:seriesValue(row,s.key,i)}))}))};}
function seriesForOverview(){const band=notes.map(n=>{const r=payload.data[`${n}|${state.velocity}`],ref=meanRef(r,-1);return {x:n,lo:ref&&Number.isFinite(ref.lo)?ref.lo-ref.mean:null,hi:ref&&Number.isFinite(ref.hi)?ref.hi-ref.mean:null,mean:ref?0:null}});return {band,estimatedBand:notes.map(n=>{const r=payload.data[`${n}|${state.velocity}`],ref=meanRef(r,-1);return {x:n,lo:ref&&r.estLo?r.estLo.at(-1)-ref.mean:null,hi:ref&&r.estHi?r.estHi.at(-1)-ref.mean:null}}),series:specs.filter(s=>s.key!=='range').map(s=>({...s,values:notes.map(n=>{const r=payload.data[`${n}|${state.velocity}`],ref=meanRef(r,-1),value=seriesValue(r,s.key,-1);return {x:n,y:ref&&Number.isFinite(value)?value-ref.mean:null}})}))};}
function interpolate(values,at){const right=d3.bisector(p=>p.x).left(values,at);if(right===0)return values[0].y;if(right>=values.length)return values.at(-1).y;const a=values[right-1],b=values[right];if(!Number.isFinite(a.y)||!Number.isFinite(b.y))return null;return a.y+(b.y-a.y)*(at-a.x)/(b.x-a.x);}
function plot(id,data,overview){
 const host=root.querySelector(id),width=Math.max(280,host.getBoundingClientRect().width),height=overview?285:330;
 const margin={left:68,right:18,top:30,bottom:58},left=margin.left,right=width-margin.right,top=margin.top,bottom=height-margin.bottom;
 let svg=d3.select(host).selectAll('svg').data([null]).join('svg').attr('class','h1-plot').attr('viewBox',`0 0 ${width} ${height}`).attr('role','img').attr('aria-label',overview?'Écart de tenue de chaque touche à la moyenne des vrais pianos':'Décroissance de la fondamentale en fonction du temps');
 const xValues=data.band.map(p=>p.x),allY=[...data.series.flatMap(s=>s.values.map(p=>p.y)),...data.band.flatMap(p=>[p.lo,p.hi]),...data.estimatedBand.flatMap(p=>[p.lo,p.hi])].filter(Number.isFinite);
 if(!allY.length)allY.push(0,1);
 const extent=d3.extent(allY),spread=(extent[1]-extent[0])||10;
 const x=d3.scaleLinear().domain(d3.extent(xValues)).range([left+4,right-4]);
 const y=d3.scaleLinear().domain([extent[0]-.08*spread,extent[1]+.08*spread]).nice().range([bottom-4,top+4]);
 svg.selectAll('rect[data-chart-frame]').data([null]).join('rect').attr('data-chart-frame','').attr('x',left).attr('y',top).attr('width',right-left).attr('height',bottom-top).attr('fill','none').attr('stroke','var(--border)');
 const selectedRow=payload.data[`${state.note}|${state.velocity}`];
 const ticks=overview?(width<450?[21,48,72,108]:[21,36,48,60,72,84,96,108]):selectedRow.times?(width<450?[selectedRow.times[0],.5,1.1]:selectedRow.times):width<450?[.03,.5,1.1]:[.03,.3,.5,.7,.9,1.1];
 svg.selectAll('g.x-axis').data([null]).join('g').attr('class','x-axis').attr('transform',`translate(0,${bottom})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(overview?n=>payload.notes[Math.round(n)]:n=>String(n).replace('.',',')));
 svg.selectAll('g.y-axis').data([null]).join('g').attr('class','y-axis').attr('transform',`translate(${left},0)`).call(d3.axisLeft(y).ticks(5));
 svg.selectAll('text.axis-title[data-axis="x"]').data([null]).join('text').attr('class','axis-title').attr('data-axis','x').attr('x',(left+right)/2).attr('y',height-12).attr('text-anchor','middle').text(overview?'Touche':'Temps après attaque (s)');
 svg.selectAll('text.axis-title[data-axis="y"]').data([null]).join('text').attr('class','axis-title').attr('data-axis','y').attr('transform',`translate(17,${(top+bottom)/2}) rotate(-90)`).attr('text-anchor','middle').text(overview?'Écart H1 / moyenne (dB)':selectedRow.anchor_time===.25?'H1 / début mesurable (dB)':'H1 / son attaque (dB)');
 svg.selectAll('text.plot-title').data([null]).join('text').attr('class','plot-title').attr('x',left).attr('y',17).text(overview?`Vélocité ${state.velocity} · ancrage propre à chaque touche`:`${payload.notes[state.note]} · vélocité ${state.velocity}`);
 const area=d3.area().defined(p=>Number.isFinite(p.lo)&&Number.isFinite(p.hi)).x(p=>x(p.x)).y0(p=>y(p.lo)).y1(p=>y(p.hi));
 svg.selectAll('path.ref-range').data(visible.range?[data.band]:[]).join('path').attr('class','ref-range').attr('d',area).attr('fill','var(--muted-foreground)').attr('opacity',.16);
 svg.selectAll('path.estimated-range').data(visible.estimated?[data.estimatedBand]:[]).join('path').attr('class','estimated-range').attr('d',area).attr('fill','var(--viz-series-4)').attr('opacity',.12);
 const line=d3.line().defined(p=>Number.isFinite(p.y)).x(p=>x(p.x)).y(p=>y(p.y));
 const active=data.series.filter(s=>visible[s.key]);
 const paths=svg.selectAll('path.data-line').data(active,s=>s.key).join('path').attr('class','data-line').attr('data-series',s=>s.key).attr('fill','none').attr('stroke',s=>s.color).attr('stroke-width',s=>s.key==='candidate'?2.5:1.7).attr('stroke-dasharray',s=>s.dash||null);
 if(first||window.matchMedia('(prefers-reduced-motion: reduce)').matches)paths.attr('d',s=>line(s.values));else paths.transition().duration(200).attr('d',s=>line(s.values));
 if(overview)svg.selectAll('line.selection').data([state.note]).join('line').attr('class','selection').attr('x1',x(state.note)).attr('x2',x(state.note)).attr('y1',top).attr('y2',bottom).attr('stroke','var(--foreground)').attr('opacity',.3);
 svg.selectAll('.hover-item').remove();
 const guide=svg.append('line').attr('class','hover-item').attr('data-chart-hover-guide','').attr('y1',top).attr('y2',bottom).attr('stroke','var(--foreground)').attr('opacity',0);
 const markers=svg.append('g').attr('class','hover-item');
 let hit=svg.selectAll('rect[data-chart-hit]').data([null]).join('rect').attr('data-chart-hit','').attr('data-chart-hover-overlay','cross-series').attr('x',left).attr('y',top).attr('width',right-left).attr('height',bottom-top).attr('fill','transparent').raise();
 function show(event){const px=Math.max(x.range()[0],Math.min(x.range()[1],d3.pointer(event,svg.node())[0])),at=x.invert(px);guide.attr('x1',px).attr('x2',px).attr('opacity',.5);const points=active.map(s=>({...s,y:interpolate(s.values,at)})).filter(s=>Number.isFinite(s.y));markers.selectAll('circle').data(points,s=>s.key).join('circle').attr('data-chart-hover-marker','').attr('cx',px).attr('cy',s=>y(s.y)).attr('r',3).attr('fill',s=>s.color);tooltip.hidden=false;tooltip.innerHTML=`<div>${overview?payload.notes[Math.round(at)]:at.toFixed(2).replace('.',',')+' s'}</div>`+points.map(s=>`<div>${s.label} : ${s.y.toFixed(1).replace('.',',')} dB</div>`).join('');const rb=root.getBoundingClientRect(),sb=svg.node().getBoundingClientRect();tooltip.style.left=Math.max(0,Math.min(width-260,px+8))+'px';tooltip.style.top=(sb.top-rb.top+top+6)+'px';}
 hit.on('pointermove',event=>{if(!pinned)show(event)}).on('pointerleave',()=>{if(!pinned){tooltip.hidden=true;guide.attr('opacity',0);markers.selectAll('*').remove()}}).on('click',event=>{if(overview){state.note=Math.round(x.invert(Math.max(x.range()[0],Math.min(x.range()[1],d3.pointer(event,svg.node())[0]))));draw();persist()}else{pinned=!pinned;show(event)}});
 // Measured collision handling: optional interior ticks yield to edge labels.
 const nodes=[...svg.node().querySelectorAll('.x-axis text')];for(let i=1;i<nodes.length;i++){const a=nodes[i-1].getBoundingClientRect(),b=nodes[i].getBoundingClientRect();if(a.right+4>b.left&&i<nodes.length-1)nodes[i].style.visibility='hidden'}
}
function draw(){const short={fast:'rapide',slow:'longue',mixed:'mixte',within:'OK',insufficient:'incertain'}; for(const option of noteSelect.options){const r=payload.data[`${option.value}|${state.velocity}`];option.textContent=payload.notes[option.value]+(r.before==='within'&&r.after==='within'?'':` · ${short[r.before]}${r.after!==r.before?' → '+short[r.after]:''}`)+(r.estimated_count?' ≈':'')} noteSelect.value=state.note;velocitySelect.value=state.velocity;legend.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(visible[b.dataset.series])));const row=payload.data[`${state.note}|${state.velocity}`];plot('#h1-detail',seriesForDetail(row),false);plot('#h1-overview',seriesForOverview(),true);root.querySelector('#h1-status').textContent=`Diagnostic${row.estimated_count?' estimé':''} : ${labels[row.before]} → ${labels[row.after]} · ${row.measured_count??row.reference_count} références complètes${row.estimated_count?' + '+row.estimated_count+' estimées':''} · ancrage : ${row.anchor_time===.25?'0,25 s (fenêtre '+Math.round(row.window_duration*1000)+' ms)':row.anchor===2?'0,3 s':'attaque'}${row.model_issue?' · '+row.model_issue:''}${row.neighbour_label?' · '+row.neighbour_label:''}${row.trial_reason?' · Essai rejeté : '+row.trial_reason:''}`;first=false;}
for(const [el,key] of [[noteSelect,'note'],[velocitySelect,'velocity']])el.onchange=()=>{state[key]=+el.value;pinned=false;tooltip.hidden=true;draw();persist()};
window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);draw()}});
new ResizeObserver(()=>draw()).observe(root.querySelector('#h1-detail'));
draw();
})();
</script>
