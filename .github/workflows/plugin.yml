# Builds the plugin (CLAP and VST3) for Linux, Windows and macOS, tests it
# by loading it as a CLAP host would, and keeps the bundles as artifacts.
# A version tag (v*) also attaches them to a GitHub release.
name: Plugin

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # Distributed bundles: no debug info (kept locally for profiling).
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu: the plugin then loads on older glibcs.
          - os: ubuntu-22.04
            name: linux-x86_64
            bundle: bundle
          - os: windows-latest
            name: windows-x86_64
            bundle: bundle
          - os: macos-latest
            name: macos-universal
            bundle: bundle-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux libraries (X11 and OpenGL for the editor)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgl-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # The test loads the cdylib, which `cargo test` does not build.
      - name: Test (load as a CLAP host, play, automate)
        run: |
          cargo build -p piano-plugin
          cargo test -p piano-plugin

      - name: Bundle
        run: cargo xtask ${{ matrix.bundle }} piano-plugin --release

      - name: Archive
        shell: bash
        run: |
          cd target/bundled
          archive="$GITHUB_WORKSPACE/unsampled-piano-${{ matrix.name }}.zip"
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip "$archive" .; else zip -r -y "$archive" .; fi

      - uses: actions/upload-artifact@v7
        with:
          name: unsampled-piano-${{ matrix.name }}
          path: unsampled-piano-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: unsampled-piano-*.zip
