# Audience microphones (1 m above the board, in front of it), lid closed
# down onto the case. Positions relative to the board.
[soundboard]
lid_removed = false
lid_angle = 0.0
mics_relative = true
mic_gain_db = 0.0

# On an upright: 1.6 m in front of it, at the height of its top.
[[soundboard.mics]]
at = [0.323529, -1.230769, 1.0]
upright = [0.0, 0.7, 1.6]
pattern = 1.0
pan = -1.0

[[soundboard.mics]]
at = [0.735294, -1.230769, 1.0]
upright = [0.0, 0.3, 1.6]
pattern = 1.0
pan = 1.0
